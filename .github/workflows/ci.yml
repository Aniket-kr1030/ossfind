name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite (used by the local PyPI index) requires Node 22+.
          node-version: 22
          cache: npm

      # `npm ci` runs the `prepare` script, which builds dist/.
      - run: npm ci

      - run: npm run typecheck

      # The whole suite is offline by design: every test replays frozen fixtures,
      # and gate G5 asserts zero network calls. No secrets or keys are needed here.
      - run: npm test

      - run: npm run gates
